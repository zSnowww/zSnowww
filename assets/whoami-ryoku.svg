<svg xmlns="http://www.w3.org/2000/svg" width="720" height="282" viewBox="0 0 720 282" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Manu (zSnow) · fastfetch dossier</title>
  <desc id="desc">OS Arch Linux with Hyprland; host Aether OS; role backend and systems developer; based in Lima, Perú; backend FastAPI, Python, Quart, Node.js, TypeScript; desktop Tauri 2, Rust, React, Next.js, ADB; data and ops PostgreSQL, Redis, Supabase, Docker, Linux.</desc>
  <!-- Misma paleta y estructura que las cards de FluxStats (tema ryoku, acento e2342a). -->
  <style>
    .title { font: 600 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #f5f2eb }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px }
    .sub { fill: #8c8780; font-size: 12px }
    .key { fill: #e2342a; font-weight: 600 }
    .val { fill: #c2c0bb }
    .dot { fill: #8c8780 }
    @keyframes enter { from { opacity: 0; transform: translateY(3px) } to { opacity: 1; transform: none } }
    .row { animation: enter .5s cubic-bezier(.25,.46,.45,.94) both }
    @media (prefers-reduced-motion: reduce) { .row { animation: none } }
  </style>

  <rect x="0.5" y="0.5" width="719" height="281" rx="6" fill="#0e0e12" stroke="#28201e"/>

  <!-- Encabezado -->
  <text class="title" x="24" y="34">manu@zsnow.dev</text>
  <text class="mono sub" x="24" y="52">$ fastfetch --profile dossier</text>
  <rect x="664.5" y="18.5" width="31" height="31" rx="6" stroke="#e2342a" stroke-opacity=".55"/>
  <text x="680" y="40" text-anchor="middle" fill="#e2342a" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="16" font-weight="700">雪</text>
  <rect x="24" y="66" width="672" height="1" fill="#28201e"/>

  <!-- Datos: clave · valor -->
  <g class="mono">
    <g class="row" style="animation-delay:60ms">
      <text class="key" x="24" y="98">os</text><text class="dot" x="128" y="98">·</text>
      <text class="val" x="148" y="98">Arch Linux x86_64 (Wayland / Hyprland)</text>
    </g>
    <g class="row" style="animation-delay:120ms">
      <text class="key" x="24" y="124">host</text><text class="dot" x="128" y="124">·</text>
      <text class="val" x="148" y="124">Aether OS (local-first architecture)</text>
    </g>
    <g class="row" style="animation-delay:180ms">
      <text class="key" x="24" y="150">role</text><text class="dot" x="128" y="150">·</text>
      <text class="val" x="148" y="150">Backend &amp; Systems Developer</text>
    </g>
    <g class="row" style="animation-delay:240ms">
      <text class="key" x="24" y="176">origin</text><text class="dot" x="128" y="176">·</text>
      <text class="val" x="148" y="176">Lima, Perú · Systems Engineering</text>
    </g>
    <g class="row" style="animation-delay:300ms">
      <text class="key" x="24" y="202">backend</text><text class="dot" x="128" y="202">·</text>
      <text class="val" x="148" y="202">FastAPI · Python · Quart · Node.js · TypeScript</text>
    </g>
    <g class="row" style="animation-delay:360ms">
      <text class="key" x="24" y="228">desktop</text><text class="dot" x="128" y="228">·</text>
      <text class="val" x="148" y="228">Tauri 2 · Rust · React · Next.js · ADB</text>
    </g>
    <g class="row" style="animation-delay:420ms">
      <text class="key" x="24" y="254">data/ops</text><text class="dot" x="128" y="254">·</text>
      <text class="val" x="148" y="254">PostgreSQL · Redis · Supabase · Docker · Linux</text>
    </g>
  </g>
</svg>
